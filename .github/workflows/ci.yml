name: Test, package, and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run static checks
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test installed CLI
        run: |
          crispr-base-editor-window-agent eval \
            --spacer TTTTCTTTTTTTTTTTTTTT \
            --editor BE4MAX \
            --pos 5 \
            --json > /tmp/result.json
          python -c "import json; d=json.load(open('/tmp/result.json')); assert d['editor_name']=='BE4MAX'; assert d['intended_position']==5"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7,<3"
      - name: Audit project dependencies
        run: pip-audit .

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Prepare static site artifact
        run: cp crispr_base_editor.py web/crispr_base_editor.py
      - name: Check browser app assets
        run: |
          test -s web/index.html
          test -s web/crispr_base_editor.py
          grep -q "loadPyodide" web/index.html
          grep -q "crispr_base_editor.py" web/index.html
          ! grep -q "/api/audit" web/index.html
