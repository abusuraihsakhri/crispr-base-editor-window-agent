[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-base-editor-window-engine"
version = "2.0.0"
description = "BaseEditor-Window: Cytidine & Adenine Base Editing (CBE/ABE) Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
crispr-base-editor-window-engine = "base_editor_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/crispr-base-editor-window-engine"
Repository = "https://github.com/abusuraihsakhri/crispr-base-editor-window-engine.git"
